name: Verify

# Two things nothing was checking before:
#   1. that the site still builds — a syntax error could reach main unchallenged;
#   2. that the database still answers the queries useMenu.js makes. The site
#      degrades to hardcoded MOCK_DATA when that breaks, so a broken contract
#      looks like a working menu with stale prices. It has to be tested, not seen.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # The repo rule — "whoever writes to the database is shishka-os" — as an
  # invariant rather than a convention. menu-photo-sync used to be the one
  # exception; it now lives in shishka-os and must not come back.
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assert this repo stays read-only
        run: node scripts/no-writes.mjs

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Reads production with the public anon key — no secret required.
      - name: Check the menu contract
        run: node scripts/contract-check.mjs

  # The build already refuses to run without a valid snapshot (prebuild). This job
  # makes that gate visible and checks the produced file explicitly: non-empty,
  # every contracts/menu-contract.json resource present, minRows met, selected
  # columns present. See docs/static-menu-snapshot.md.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the menu snapshot (anon key, read-only)
        run: node scripts/snapshot-menu.mjs
      - name: Snapshot is non-empty and matches the contract
        run: node scripts/snapshot-check.mjs
